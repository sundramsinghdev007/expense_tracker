# .github/workflows/auto-implement.yml
#
# Fully agentic feature implementation pipeline.
# Trigger: apply label "ready-to-implement" to any GitHub issue.
# Claude reads the issue, implements the feature, and opens a PR automatically.
#
# Required secrets:
#   ANTHROPIC_API_KEY  — your Anthropic API key
#   (GITHUB_TOKEN is provided automatically by GitHub Actions)
#
# Required label: create "ready-to-implement" in GitHub → Issues → Labels

name: Auto-Implement Feature

on:
  issues:
    types: [labeled]

jobs:
  implement:
    # Only run when the specific trigger label is applied
    if: github.event.label.name == 'ready-to-implement'
    runs-on: ubuntu-latest

    permissions:
      contents: write        # push branches
      issues: write          # post comments
      pull-requests: write   # create PRs

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # full history for accurate branch detection

      # ── 2. JDK + build environment ─────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 3. Configure git identity ───────────────────────────────────────────
      - name: Configure git
        run: |
          git config user.name  "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"

      # ── 4. Create feature branch ────────────────────────────────────────────
      - name: Create feature branch
        id: branch
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          # Slugify the issue title: lowercase, replace non-alphanumeric with dash, trim
          SLUG=$(echo "${{ github.event.issue.title }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/--*/-/g' \
            | sed 's/^-\|-$//g' \
            | cut -c1-50)
          BRANCH="feature/issue-${ISSUE_NUM}-${SLUG}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH"   >> $GITHUB_OUTPUT
          echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "Branch created: $BRANCH"

      # ── 5. Announce on the issue ─────────────────────────────────────────────
      - name: Post "working on it" comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: [
                '## 🤖 Claude Code is on it',
                '',
                `Working on branch: \`${{ steps.branch.outputs.branch }}\``,
                '',
                '**Steps running now:**',
                '1. 📖 Reading project memory and architecture rules',
                '2. 🗺️  Planning domain → data → feature → resources',
                '3. 💻 Implementing bottom-up following CLAUDE.md',
                '4. 🔨 Build verify loop until `assembleDebug` passes',
                '5. 🧪 Running unit tests',
                '6. 📬 Opening a PR',
                '',
                '_I will update this thread when the PR is ready._'
              ].join('\n')
            });

      # ── 6. Write issue safely to a file (avoids shell injection) ───────────
      - name: Write issue to prompt file
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const issue = context.payload.issue;

            const prompt = [
              '/implement-and-pr',
              `Issue #${issue.number}: ${issue.title}`,
              '',
              issue.body || '(No description provided.)',
              '',
              '## CI Context',
              `Branch: ${{ steps.branch.outputs.branch }}`,
              `Commit message: feat: ${issue.title} (closes #${issue.number})`,
              '',
              'IMPORTANT:',
              '- DO NOT set JAVA_HOME — it is already set by the CI environment.',
              '- After a green build and passing tests, run: git add -A && git commit',
              '- DO NOT push — the CI workflow will push after you commit.',
              '- If the build cannot be fixed in 5 attempts, exit with a clear error summary.'
            ].join('\n');

            fs.writeFileSync('/tmp/claude-prompt.txt', prompt, 'utf8');
            core.info(`Prompt (${prompt.length} chars) written to /tmp/claude-prompt.txt`);

      # ── 7. Install Claude CLI ────────────────────────────────────────────────
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # ── 8. Run Claude — the agentic implementation loop ────────────────────
      - name: Run Claude implementation agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ANDROID_HOME is already set in ubuntu-latest runners
          # JAVA_HOME is already set by actions/setup-java above
        run: |
          PROMPT=$(cat /tmp/claude-prompt.txt)
          claude -p "$PROMPT" \
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep"

      # ── 9. Check Claude actually committed something ────────────────────────
      - name: Verify commits were made
        id: commits
        run: |
          COUNT=$(git rev-list --count HEAD ^origin/develop 2>/dev/null \
            || git rev-list --count HEAD ^origin/main 2>/dev/null \
            || echo 0)
          echo "commit_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Commits ahead of base: $COUNT"
          if [ "$COUNT" -eq "0" ]; then
            echo "::warning::Claude made no commits. Implementation may have failed."
          fi

      # ── 10. Push the branch ─────────────────────────────────────────────────
      - name: Push branch
        if: steps.commits.outputs.commit_count != '0'
        run: git push origin ${{ steps.branch.outputs.branch }}

      # ── 11. Create Pull Request ─────────────────────────────────────────────
      - name: Create Pull Request
        id: pr
        if: steps.commits.outputs.commit_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base    develop \
            --head    "${{ steps.branch.outputs.branch }}" \
            --title   "feat: ${{ github.event.issue.title }}" \
            --body    "$(cat <<'EOF'
          ## Summary

          Automatically implemented by Claude Code in response to issue #${{ github.event.issue.number }}.

          Closes #${{ github.event.issue.number }}

          ## What Claude did
          - Read project memory and architecture rules (CLAUDE.md)
          - Planned implementation: domain → data → feature → resources
          - Implemented following all CLAUDE.md §6 coding rules
          - Build verified (`./gradlew assembleDebug` — green)
          - Unit tests verified (`./gradlew test` — green)

          ## Before merging
          - [ ] Review code follows CLAUDE.md architecture rules
          - [ ] No hardcoded strings (`Text("...")` must use `stringResource`)
          - [ ] New composables are stateless
          - [ ] `LazyColumn` items have `key = { it.id }`
          - [ ] **Deploy to device and test manually** (`./scripts/deploy.sh`)

          ---
          🤖 Generated by [Claude Code](https://claude.ai/code)
          EOF
          )")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "PR created: $PR_URL"

      # ── 12. Post final status comment on the issue ──────────────────────────
      - name: Post success comment
        if: steps.commits.outputs.commit_count != '0' && steps.pr.outputs.pr_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: [
                '## ✅ Implementation complete',
                '',
                `PR opened: ${{ steps.pr.outputs.pr_url }}`,
                '',
                '**What was done:**',
                '- ✅ Feature implemented following CLAUDE.md architecture rules',
                '- ✅ `./gradlew assembleDebug` — BUILD SUCCESSFUL',
                '- ✅ `./gradlew test` — all tests passing',
                '',
                '**What you need to do:**',
                '1. Review the PR diff',
                '2. Deploy to device: `./scripts/deploy.sh`',
                '3. Test the feature manually',
                '4. Merge if everything looks good'
              ].join('\n')
            });

      - name: Post failure comment
        if: steps.commits.outputs.commit_count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: [
                '## ⚠️ Implementation did not complete',
                '',
                'Claude Code could not fully implement this feature automatically.',
                'This can happen when:',
                '- The feature requires architectural changes too complex for a single run',
                '- The issue description needs more detail',
                '- Build errors could not be resolved automatically',
                '',
                '**Next steps:**',
                '1. Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions) for details',
                '2. Add more detail to this issue description',
                '3. Remove and re-apply the `ready-to-implement` label to retry',
                '4. Or implement manually: `./scripts/agent.sh "${{ github.event.issue.title }}"`'
              ].join('\n')
            });
