# .github/workflows/claude-review.yml
# Posts an AI code review comment on every PR using the Claude API.
# Checks CLAUDE.md architecture rules and flags violations in the diff.
#
# Setup: add ANTHROPIC_API_KEY to repository secrets
#   GitHub → Settings → Secrets and variables → Actions → New repository secret

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  ai-review:
    name: Claude Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff (Kotlin + XML + Gradle files only)
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.kt' '*.xml' '*.kts' '*.toml' > /tmp/pr.diff
          DIFF_SIZE=$(wc -c < /tmp/pr.diff)
          echo "diff_size=$DIFF_SIZE" >> $GITHUB_OUTPUT
          echo "Diff size: $DIFF_SIZE bytes"

      - name: Skip if no relevant changes
        if: steps.diff.outputs.diff_size == '0'
        run: echo "No Kotlin/XML/Gradle changes — skipping Claude review."

      - name: Run Claude Review
        if: steps.diff.outputs.diff_size != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'PYTHON'
          import json, urllib.request, os, sys

          with open('/tmp/pr.diff') as f:
              diff = f.read()[:10000]  # cap at 10k chars to stay within token limits

          rules = """You are reviewing an Android Kotlin PR for violations of the project's CLAUDE.md architecture rules.

          Check ONLY for these specific violations (ignore style, formatting, and minor suggestions):

          1. **Cross-feature imports** — a :feature:X module importing from :feature:Y (packages: dashboard, addexpense, analytics, budgets, ocr, settings)
          2. **Hardcoded strings in Text()** — `Text("some text")` instead of `Text(stringResource(R.string.key))`
          3. **Magic .dp values** — `16.dp` inline instead of `Dimens.spacingMd`
          4. **!! null assertions** — use `?.let`, `requireNotNull()`, or `?:` instead
          5. **GlobalScope** — must use `viewModelScope` or `lifecycleScope`
          6. **LiveData in new code** — use `StateFlow` / `SharedFlow` instead
          7. **Business logic in Composables** — computation or side-effects that belong in ViewModel/UseCase
          8. **Stateful composable below screen level** — `viewModel()` called inside a non-screen composable
          9. **LazyColumn items() without key** — `items(list)` must be `items(list, key = { it.id })`
          10. **var in data class** — use `val` + `copy()`

          Format your response as:
          - If violations found: list each as `❌ [Rule N] file.kt:line — explanation`
          - If no violations: output exactly one line: `✅ No CLAUDE.md violations found in this PR.`

          Do not comment on things that are not in the list above."""

          payload = json.dumps({
              "model": "claude-sonnet-4-6",
              "max_tokens": 1500,
              "messages": [{
                  "role": "user",
                  "content": f"{rules}\n\n---\n\nPR Diff:\n```\n{diff}\n```"
              }]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.loads(resp.read())
                  review = result["content"][0]["text"]
          except Exception as e:
              review = f"⚠️ Claude review failed: {e}"

          with open('/tmp/review.txt', 'w') as f:
              f.write(review)
          print(review)
          PYTHON

      - name: Post Review Comment
        if: steps.diff.outputs.diff_size != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let review;
            try {
              review = fs.readFileSync('/tmp/review.txt', 'utf8');
            } catch (e) {
              review = '⚠️ Claude review output not found.';
            }

            const body = [
              '## 🤖 Claude Code Review',
              '',
              review,
              '',
              '---',
              '*Checked against [CLAUDE.md](../../blob/${{ github.head_ref }}/CLAUDE.md) §7.3 prohibited patterns*'
            ].join('\n');

            // Delete previous bot review comments to avoid noise
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const comment of comments.data) {
              if (comment.user.type === 'Bot' && comment.body.includes('🤖 Claude Code Review')) {
                await github.rest.issues.deleteComment({
                  comment_id: comment.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
              }
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
