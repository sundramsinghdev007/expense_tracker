# .github/workflows/architecture-check.yml
# Enforces CLAUDE.md architecture rules on every PR to main or develop.
# Runs independently of the main CI build — fast feedback on rule violations.

name: Architecture Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  claude-md-compliance:
    name: CLAUDE.md Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Rule 1: No cross-feature imports ─────────────────────────────────
      - name: "Rule — no cross-feature imports"
        run: |
          FAIL=0
          declare -A PKG_MAP
          PKG_MAP["dashboard"]="feature/dashboard/src"
          PKG_MAP["addexpense"]="feature/add-expense/src"
          PKG_MAP["analytics"]="feature/analytics/src"
          PKG_MAP["budgets"]="feature/budgets/src"
          PKG_MAP["ocr"]="feature/ocr/src"
          PKG_MAP["settings"]="feature/settings/src"

          for SRC_PKG in "${!PKG_MAP[@]}"; do
            SRC_DIR="${PKG_MAP[$SRC_PKG]}"
            [ -d "$SRC_DIR" ] || continue
            for TARGET_PKG in "${!PKG_MAP[@]}"; do
              [ "$SRC_PKG" = "$TARGET_PKG" ] && continue
              MATCHES=$(grep -rn "import com.sundram.expense_tracker.$TARGET_PKG" \
                "$SRC_DIR/main" --include="*.kt" 2>/dev/null || true)
              if [ -n "$MATCHES" ]; then
                echo "❌ VIOLATION: feature:$SRC_PKG imports feature:$TARGET_PKG (cross-feature dependency)"
                echo "$MATCHES"
                FAIL=1
              fi
            done
          done

          if [ $FAIL -eq 0 ]; then
            echo "✅ No cross-feature imports found."
          fi
          exit $FAIL

      # ── Rule 2: No hardcoded strings in Text() ────────────────────────────
      - name: "Rule — no hardcoded strings in Text()"
        run: |
          MATCHES=$(grep -rn 'Text("' feature/ app/ --include="*.kt" \
            | grep -v "^\s*//" \
            | grep -v "/test/" \
            | grep -v "/androidTest/" \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ VIOLATION: hardcoded string literals in Text() — use stringResource()"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No hardcoded strings in Text() found."

      # ── Rule 3: No magic .dp values outside Dimens.kt ────────────────────
      - name: "Rule — no magic .dp values"
        run: |
          MATCHES=$(grep -rn '\b[0-9]\+\.dp\b' feature/ app/ --include="*.kt" \
            | grep -v "Dimens\." \
            | grep -v "Dimens\.kt" \
            | grep -v "^\s*//" \
            | grep -v "/test/" \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ VIOLATION: magic .dp values — use Dimens.kt tokens"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No magic .dp values found."

      # ── Rule 4: No !! null assertions ────────────────────────────────────
      - name: "Rule — no !! null assertions"
        run: |
          MATCHES=$(grep -rn '!!' feature/ app/ --include="*.kt" \
            | grep -v "^\s*//" \
            | grep -v "/test/" \
            | grep -v "//.*!!" \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ VIOLATION: !! null assertions — use ?.let, requireNotNull(), or ?:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No !! null assertions found."

      # ── Rule 5: No GlobalScope ────────────────────────────────────────────
      - name: "Rule — no GlobalScope"
        run: |
          MATCHES=$(grep -rn 'GlobalScope' feature/ app/ core/ --include="*.kt" \
            | grep -v "^\s*//" \
            | grep -v "/test/" \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ VIOLATION: GlobalScope — use viewModelScope or lifecycleScope"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No GlobalScope usage found."

      # ── Rule 6: No LiveData in feature modules ────────────────────────────
      - name: "Rule — no LiveData in new code"
        run: |
          MATCHES=$(grep -rn 'LiveData\|MutableLiveData\|liveData {' feature/ --include="*.kt" \
            | grep -v "^\s*//" \
            | grep -v "/test/" \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ VIOLATION: LiveData in feature module — use StateFlow or SharedFlow"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No LiveData usage found."

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: success()
        run: |
          echo ""
          echo "✅ All CLAUDE.md architecture rules passed."
